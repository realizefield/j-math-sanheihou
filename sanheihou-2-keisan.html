<!DOCTYPE html>

<style>:root{--ink:#26323f;--sub:#5b6b7a;--line:#d9e1e8;--bg:#f4f7fa;--card:#fff;--main:#1f6fb2;--main-d:#14507f;--ct:#ffe0b3;--ct-s:#d9822b;--ok:#1f9d55;--ng:#d64545}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","BIZ UDGothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;line-height:1.85;font-size:17px}

header.hero p{margin:0;opacity:.95}
nav.units{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;justify-content:center}
nav.units a{text-decoration:none;color:var(--main-d);background:#eaf3fb;padding:4px 11px;border-radius:999px;font-size:13.5px;white-space:nowrap}

main{max-width:860px;margin:0 auto;padding:14px 14px 80px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px 24px;margin:18px 0;box-shadow:0 2px 8px rgba(40,70,100,.06)}
h2{margin:0 0 8px;font-size:22px;color:var(--main-d);border-left:7px solid var(--main);padding-left:12px;line-height:1.5}

.lead{color:var(--sub);margin:4px 0 12px}
.point{background:#fff8e6;border:2px solid #f0c15a;border-radius:10px;padding:10px 16px;margin:12px 0}
.point b.t{display:inline-block;background:#f0a81a;color:#fff;border-radius:6px;padding:0 10px;margin-right:8px;font-size:15px}
.point .big{text-align:center;font-size:24px;font-weight:700;margin:4px 0}
.ex{border:1px solid #cfe0ef;border-radius:12px;padding:14px 16px 16px;margin:16px 0;background:#fcfeff}

.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
button{font-family:inherit;font-size:16px;border:none;border-radius:9px;padding:8px 16px;cursor:pointer;background:var(--main);color:#fff}

i.v{font-style:italic;font-family:"Times New Roman","BIZ UDPMincho",serif;font-size:1.08em}
table.rt{border-collapse:collapse;margin:8px auto}table.rt td,table.rt th{border:1px solid #9fb3c4;padding:4px 14px;text-align:center}

svg .semi{fill:rgba(255,150,40,.42);stroke:#d9822b;stroke-width:2.2;stroke-linejoin:round}

.katex{font-size:1.08em}

/* 図版の共通調整：白背景・文字の縁取り・補助線の区別・スマホ対応 */
.fig{background:#fff;border:1px solid #d5e4ef;border-radius:13px;padding:12px 8px;margin:14px auto;box-sizing:border-box;overflow:visible}
.fig svg{display:block;margin:auto;overflow:visible;max-width:100%;height:auto;filter:none}
.fig svg .lab{paint-order:stroke fill;stroke:#fff;stroke-width:4px;stroke-linejoin:round;font-family:"BIZ UDPGothic","BIZ UDゴシック",system-ui,sans-serif;letter-spacing:.01em}
.fig svg .lab.s{font-size:16px}.fig svg .lab.m{font-size:19px}
.fig svg .ln,.fig svg .ra{stroke-linecap:round;stroke-linejoin:round}
.fig svg .ln.aux{stroke:#d64c36;stroke-dasharray:7 5;stroke-width:2.9}
.fig svg .ln.dash{stroke:#66788c;stroke-dasharray:5 5;stroke-opacity:.8}
.fig svg .hl{fill:#ffe0a0;fill-opacity:.38;stroke:#df8020;stroke-width:2.4}
.fig svg .semi{fill:#f6c26e;fill-opacity:.24;stroke:#d97b27;stroke-width:2.2}
.fig svg .ln.thin{stroke:#d9e4ed;stroke-width:.9;stroke-opacity:.9}
.fig svg .ln.ax{stroke:#37566b;stroke-width:1.7}
@media(max-width:520px){.fig{padding:10px 4px}.fig svg .lab.m{font-size:18px}}
.pn{display:flex;justify-content:space-between;gap:10px;max-width:860px;margin:10px auto 0;padding:0 14px}
.pn a{flex:1;text-align:center;text-decoration:none;background:#1f6fb2;color:#fff;border-radius:10px;padding:12px 8px;font-weight:700}
.pn a.prev{background:#fff;color:#1f6fb2;border:2px solid #1f6fb2}
.pn span{flex:1}
</style></head><body>
<script>/* ===== 江原予備校 GAMBA 三平方の定理 共通部品 ===== */
const $ = id => document.getElementById(id);
const UNITS = [
  ['sanheihou.html','① なぜ成り立つか'],
  ['sanheihou-2-keisan.html','② 計算'],
  ['sanheihou-3-hojo1.html','③ 補助線①'],
  ['sanheihou-4-hojo2.html','④ 補助線②（円）'],
  ['sanheihou-5-zahyo.html','⑤ 座標'],
  ['sanheihou-6-kukan.html','⑥ 空間図形'],
  ['sanheihou-7-hi.html','⑦ 特別な三角形'],
  ['sanheihou-8-taiseki.html','⑧ 体積・方程式'],
  ['sanheihou-9-matome.html','⑨ まとめ演習']
];
/* 数式の簡易表記 → HTML */
function _bal(s,i){let d=0;for(let j=i;j<s.length;j++){if(s[j]==='{')d++;else if(s[j]==='}'){d--;if(d===0)return j;}}return s.length-1;}
function _tex(s){
  let o='';
  for(let i=0;i<s.length;){
    if(s.startsWith('√{',i)){const j=_bal(s,i+1);o+='\\sqrt{'+_tex(s.slice(i+2,j))+'}';i=j+1;}
    else if(s[i]==='√'&&/\d/.test(s[i+1]||'')){let k=i+1,d='';while(/\d/.test(s[k]||'')){d+=s[k];k++;}o+='\\sqrt{'+d+'}';i=k;}
    else if(s.startsWith('F{',i)){const j=_bal(s,i+1);const in_=s.slice(i+2,j);let dp=0,cut=-1;for(let k=0;k<in_.length;k++){if(in_[k]==='{')dp++;else if(in_[k]==='}')dp--;else if(in_[k]==='|'&&dp===0){cut=k;break;}}
      o+='\\dfrac{'+_tex(in_.slice(0,cut))+'}{'+_tex(in_.slice(cut+1))+'}';i=j+1;}
    else if(s[i]==='^'&&/\d/.test(s[i+1]||'')){o+='^{'+s[i+1]+'}';i+=2;}
    else if(s[i]==='×'){o+='\\times ';i++;}
    else if(s[i]==='−'){o+='-';i++;}
    else if(s[i]==='√'){o+='\\sqrt{}';i++;}
    else{o+=s[i];i++;}
  }
  return o;
}
function _kx(t){try{return katex.renderToString(t,{throwOnError:false});}catch(e){return t;}}
function M(s){
  s=String(s);
  if(typeof katex==='undefined'){
    return s.replace(/\^(\d)/g,'<sup>$1</sup>').replace(/√\{([^}]*)\}/g,'√$1').replace(/F\{([^|}]*)\|([^}]*)\}/g,'($1)/($2)').replace(/\*([a-zA-Z])\*/g,'<i class="v">$1</i>');
  }
  let out='',buf='';
  const flush=()=>{out+=buf.replace(/\^(\d)/g,'<sup>$1</sup>').replace(/\*([a-zA-Z])\*/g,'<i class="v">$1</i>');buf='';};
  for(let i=0;i<s.length;){
    const isAtom=s.startsWith('√',i)||s.startsWith('F{',i);
    if(isAtom){
      let j;
      if(s.startsWith('F{',i))j=_bal(s,i+1)+1;
      else if(s.startsWith('√{',i))j=_bal(s,i+1)+1;
      else{j=i+1;while(/\d/.test(s[j]||''))j++;}
      let coef='';const m=buf.match(/(\d+)$/);
      if(m){coef=m[1];buf=buf.slice(0,-coef.length);}
      let atom=s.slice(i,j);
      let sup='';const sm=s.slice(j).match(/^\^(\d)/);
      if(sm){atom+='^'+sm[1];j+=2;}
      flush();out+=_kx(_tex(coef+atom));i=j;
    }else{buf+=s[i];i++;}
  }
  flush();return out;
}
/* ---- 図の描画 ---- */
function view(box,W,H,pad){
  const k=Math.min((W-2*pad)/(box[2]-box[0]),(H-2*pad)/(box[3]-box[1]));
  const ox=(W-k*(box[2]-box[0]))/2-k*box[0];
  const oy=(H+k*(box[3]-box[1]))/2+k*box[1];
  return {k,p:(x,y)=>[ox+k*x,oy-k*y]};
}
function renderFig(F,step){
  const W=F.w||480,H=F.h||320;
  const v=view(F.box,W,H,F.pad===undefined?18:F.pad);
  let o='';
  const vis=op=>{op=op||{};return (op.s||0)<=step && !(op.e!==undefined&&step>=op.e);};
  const P=(p)=>v.p(p[0],p[1]);
  const pstr=a=>a.map(q=>P(q).map(z=>z.toFixed(1)).join(',')).join(' ');
  const g={
    v,
    poly(pts,cls,op){ if(vis(op)) o+=`<polygon class="${cls||'tri'}" points="${pstr(pts)}"/>`; },
    line(a,b,cls,op){ if(vis(op)){const A=P(a),B=P(b);o+=`<line class="ln ${cls||''}" x1="${A[0].toFixed(1)}" y1="${A[1].toFixed(1)}" x2="${B[0].toFixed(1)}" y2="${B[1].toFixed(1)}"/>`;} },
    t(p,s,dx,dy,op){ if(vis(op)){op=op||{};const A=P(p);
      if(/√|F\{/.test(s)&&typeof katex!=='undefined'){const fs=({s:15,m:18,b:22})[op.c||'s'];const X=A[0]+(dx||0),Y=A[1]+(dy||0);
        o+=`<foreignObject x="${(X-70).toFixed(1)}" y="${(Y-22).toFixed(1)}" width="140" height="44" style="overflow:visible"><div xmlns="http://www.w3.org/1999/xhtml" class="flab" style="font-size:${fs}px;color:${op.col||'#26323f'}">${M(s)}</div></foreignObject>`;
      } else o+=`<text class="lab ${op.c||'s'}" x="${(A[0]+(dx||0)).toFixed(1)}" y="${(A[1]+(dy||0)).toFixed(1)}"${op.col?` style="--lf:${op.col}"`:''}>${s}</text>`;} },
    ra(p,d1,d2,op){ if(vis(op)){const A=P(p),px=(op&&op.px)||12;const n1=Math.hypot(d1[0],d1[1])||1,n2=Math.hypot(d2[0],d2[1])||1;const e1=[d1[0]*px/n1,-d1[1]*px/n1],e2=[d2[0]*px/n2,-d2[1]*px/n2];
      o+=`<path class="ra" d="M${A[0]+e1[0]},${A[1]+e1[1]} L${A[0]+e1[0]+e2[0]},${A[1]+e1[1]+e2[1]} L${A[0]+e2[0]},${A[1]+e2[1]}"/>`;} },
    dot(p,op){ if(vis(op)){const A=P(p);o+=`<circle class="dot" cx="${A[0].toFixed(1)}" cy="${A[1].toFixed(1)}" r="3.4"/>`;} },
    circ(c,r,cls,op){ if(vis(op)){const A=P(c);o+=`<circle class="${cls||'plain'}" cx="${A[0].toFixed(1)}" cy="${A[1].toFixed(1)}" r="${(r*v.k).toFixed(1)}"/>`;} },
    /* 楕円。half:'front'(下半分)・'back'(上半分) */
    ell(c,rx,ry,cls,op){ if(vis(op)){op=op||{};const A=P(c),RX=rx*v.k,RY=ry*v.k;
      if(!op.half){o+=`<ellipse class="${cls||'plain'}" cx="${A[0].toFixed(1)}" cy="${A[1].toFixed(1)}" rx="${RX.toFixed(1)}" ry="${RY.toFixed(1)}"/>`;}
      else{ const x0=A[0]-RX,x1=A[0]+RX;
        if(op.half==='front') o+=`<path class="ln" d="M${x0},${A[1]} A${RX},${RY} 0 0 0 ${x1},${A[1]}"/>`;
        else o+=`<path class="ln dash" d="M${x0},${A[1]} A${RX},${RY} 0 0 1 ${x1},${A[1]}"/>`; } } },
    /* 角度の弧（数学座標の角 a0→a1 ラジアン） */
    arc(c,r,a0,a1,col,op){ if(vis(op)){const A=P(c);let d='';for(let i=0;i<=14;i++){const a=a0+(a1-a0)*i/14;d+=(i?'L':'M')+(A[0]+r*Math.cos(a)).toFixed(1)+','+(A[1]-r*Math.sin(a)).toFixed(1);}
      o+=`<path d="${d}" fill="none" stroke="${col||'#d63a3a'}" stroke-width="2.6"/>`;} }
  };
  F.f(g,step);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="問題の図形：色付きの線は注目する辺、赤い破線は補助線を表します" shape-rendering="geometricPrecision"><title>三平方の定理の図形</title>${o}</svg>`;
}
/* 直角三角形：(0,0),(w,0),(w,h)・直角は右下 */
function RT(g,o){
  const w=o.w,h=o.h,len=Math.hypot(w,h);
  g.poly([[0,0],[w,0],[w,h]],o.cls||'tri');
  g.ra([w,0],[-1,0],[0,1],{px:13});
  if(o.lb!==undefined) g.t([w/2,0],o.lb,0,19,{c:'m'});
  if(o.lr!==undefined) g.t([w,h/2],o.lr,22,0,{c:'m'});
  if(o.lh!==undefined) g.t([w/2,h/2],o.lh,-22*h/len,-22*w/len,{c:'m'});
}
/* 直方体（底面EFGH・上面ABCD、A-E, B-F, C-G, D-H）  EF=w, FG=d(奥行き), GC=h */
function cuboid(g,w,d,h,opt){
  opt=opt||{}; const ox=d*0.42, oy=d*0.32;
  const E=[0,0],F=[w,0],G=[w+ox,oy],H=[ox,oy],A=[0,h],B=[w,h],C=[w+ox,oy+h],D=[ox,oy+h];
  g.poly([A,B,C,D],'plain'); g.poly([A,B,F,E],'plain'); g.poly([B,C,G,F],'plain');
  g.line(E,H,'dash'); g.line(H,G,'dash'); g.line(H,D,'dash');
  const names={A,B,C,D,E,F,G,H};
  if(opt.names!==false){
    g.t(A,'A',-11,-10);g.t(B,'B',-2,-15);g.t(C,'C',12,-6);g.t(D,'D',-6,-12);
    g.t(E,'E',-11,12);g.t(F,'F',10,13);g.t(G,'G',12,8);g.t(H,'H',-12,8);
  }
  return names;
}
/* ---- 例題 ---- */
function mountExample(host,E){
  host.className='ex';
  host.innerHTML=`<div class="exh">${E.title}</div><div class="exq">${M(E.q)}</div>
  <div class="fig"></div><div class="steptext"></div><div class="formula"></div>
  <div class="ctrl"><button class="ghost" data-a="prev">◀ もどる</button><button data-a="next">次へ ▶</button><button class="ghost" data-a="reset">最初から</button><span class="dots"></span></div>`;
  let i=0; const n=E.steps.length;
  const q=s=>host.querySelector(s);
  function render(){
    q('.fig').innerHTML=renderFig(E.fig,i);
    q('.steptext').innerHTML=M(E.steps[i].t);
    q('.formula').innerHTML=E.steps[i].f?E.steps[i].f.split('¶').map(x=>'<span class="ln">'+M(x)+'</span>').join(''):'';
    q('.dots').textContent='STEP '+(i+1)+' / '+n;
    q('[data-a=prev]').disabled=i===0; q('[data-a=next]').disabled=i===n-1;
  }
  q('[data-a=prev]').onclick=()=>{if(i>0){i--;render();}};
  q('[data-a=next]').onclick=()=>{if(i<n-1){i++;render();}};
  q('[data-a=reset]').onclick=()=>{i=0;render();};
  render();
}
/* ---- 練習 ---- */
const SOLVED={n:0,total:0};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mountPractice(host,PR){
  const wrap=document.createElement('div');
  PR.items.forEach((it,idx)=>{
    SOLVED.total++;
    const d=document.createElement('div'); d.className='pr';
    d.innerHTML=`<div class="qt">${PR.no||'練習'}(${idx+1})　${M(it.q)}</div>${it.fig?`<div class="fig">${renderFig(it.fig,0)}</div>`:''}
      <div class="opts"></div><div class="fb"></div><div class="sol"></div><button class="hintbtn">💡 ヒント</button>`;
    const opts=d.querySelector('.opts'),fb=d.querySelector('.fb'),sol=d.querySelector('.sol');
    let done=false;
    shuffle(it.ch.map((c,k)=>({c,k}))).forEach(o=>{
      const b=document.createElement('button'); b.innerHTML=M(o.c);
      b.onclick=()=>{
        if(done) return;
        if(o.k===it.a){
          done=true; b.classList.add('right'); fb.className='fb ok'; fb.textContent='⭕ 正解です！　解き方を確かめましょう。';
          sol.innerHTML=it.sol.split('¶').map(x=>'<span class="ln">'+M(x)+'</span>').join(''); sol.classList.add('on');
          if(it.fig){ d.querySelector('.fig').innerHTML=renderFig(it.fig,99); }
          SOLVED.n++; updateProg();
        }else{ b.classList.add('wrong'); fb.className='fb ng'; fb.textContent='もう一度考えてみましょう。「ヒント」も使えます。'; }
      };
      opts.appendChild(b);
    });
    d.querySelector('.hintbtn').onclick=()=>{ $('modal-t').innerHTML=M(it.hint); $('modal').classList.add('on'); };
    wrap.appendChild(d);
  });
  host.appendChild(wrap);
}
function updateProg(){
  const e=$('prog'); if(e) e.textContent=SOLVED.n+' / '+SOLVED.total+' 問 正解';
  if(SOLVED.n===SOLVED.total && SOLVED.total>0){ $('clear').style.display='block'; startPetals(); }
}
/* ---- 花吹雪 ---- */
function startPetals(){
  const cv=$('petals'),ctx=cv.getContext('2d');
  cv.width=innerWidth;cv.height=innerHeight;
  const P=[];for(let i=0;i<140;i++)P.push({x:Math.random()*cv.width,y:-Math.random()*cv.height,r:5+Math.random()*7,vy:1.2+Math.random()*2.2,vx:-.8+Math.random()*1.6,rot:Math.random()*6.28,vr:-.05+Math.random()*.1,c:['#ffb7d1','#ff9ec2','#ffd1e1','#ffc2d9'][i%4]});
  const t0=performance.now();
  (function loop(now){ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin((now+p.r*200)/600)*.6;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*.6,0,0,6.28);ctx.fill();ctx.restore();});
    if(now-t0<6000)requestAnimationFrame(loop);else ctx.clearRect(0,0,cv.width,cv.height);})(t0);
}

  main.appendChild(fin);

}
